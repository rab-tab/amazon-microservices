---
# ─── User Service ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: amazon
  labels:
    app: user-service
    version: "1.0.0"
spec:
  replicas: 1  # was 2 — QA doesn't need HA; halves resource footprint
  selector:
    matchLabels:
      app: user-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: user-service
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8081"
    spec:
      # Required for containerd (k3s) to authenticate to private ECR —
      # create once via:
      #   kubectl create secret docker-registry ecr-registry-secret \
      #     --docker-server=978185568053.dkr.ecr.us-east-1.amazonaws.com \
      #     --docker-username=AWS \
      #     --docker-password="$(aws ecr get-login-password --region us-east-1)" \
      #     -n amazon
      # Note: ECR tokens expire ~12h, so this secret needs periodic
      # refresh (e.g. a CronJob, or Jenkins recreating it each run).
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: user-service
          # __TAG_USER_SERVICE__ is a placeholder — Jenkins substitutes
          # this before `kubectl apply`, e.g.:
          #   sed -i "s/__TAG_USER_SERVICE__/${TAG_USER_SERVICE}/" user-service.yaml
          # mirrors the ${TAG_USER_SERVICE} pattern docker-compose used.
          image: 978185568053.dkr.ecr.us-east-1.amazonaws.com/amazon-user-service:__TAG_USER_SERVICE__
          imagePullPolicy: Always  # was IfNotPresent — with mutable tags
            # like "latest", IfNotPresent would
          # keep using a stale cached image
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: user-service-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: amazon-secrets
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: amazon-secrets
                  key: db-password
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: amazon-secrets
                  key: redis-password
            - name: SPRING_SECURITY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: amazon-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Switched from /actuator/health/readiness and .../liveness to
          # plain /actuator/health — the split probe-group endpoints only
          # exist if management.endpoint.health.probes.enabled=true is
          # set, which we haven't confirmed for this service. Every
          # healthcheck that's actually worked today (compose, manual
          # curl) hit plain /actuator/health. Confirm the probes.enabled
          # config and switch back if you want the more granular split.
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: amazon
  labels:
    app: user-service
spec:
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081
      name: http
  type: ClusterIP
