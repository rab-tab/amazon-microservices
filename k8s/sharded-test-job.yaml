# ════════════════════════════════════════════════════════════════
# Sharded test runner — K8s Indexed Job
#
# completionMode: Indexed makes Kubernetes launch `completions` pods
# and inject JOB_COMPLETION_INDEX (0, 1, 2, ...) into each one
# automatically — ShardingInterceptor reads this to know which slice
# of regression.xml it owns.
#
# The actual test command lives in the image's own Dockerfile CMD —
# this manifest only needs to set TOTAL_SHARDS and point at the image.
# JOB_COMPLETION_INDEX is NOT set here — Kubernetes injects it itself,
# setting it manually would override the real per-pod value.
#
# Pods run inside the "amazon" namespace directly, so BASE_URL/DB_HOST/
# KAFKA_SERVERS/REDIS_HOST (baked into the image as in-cluster DNS
# names — api-gateway, postgres-service, etc.) resolve correctly with
# no port-forwarding needed.
# ════════════════════════════════════════════════════════════════
apiVersion: batch/v1
kind: Job
metadata:
  name: sharded-test-run
  namespace: amazon
spec:
  completionMode: Indexed
  completions: 3      # total shard count — 148 tests / 3 ≈ 49 per shard
  parallelism: 3       # how many run simultaneously
  backoffLimit: 0      # don't retry a failed shard — a real test
  # failure should surface immediately
  ttlSecondsAfterFinished: 300  # auto-cleanup finished pods after 5 min,
    # so repeated runs don't accumulate
    # leftover Job objects like we saw with
  # containers earlier today
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: test-shard
          image: 978185568053.dkr.ecr.us-east-1.amazonaws.com/amazon-test-automation:latest
          imagePullPolicy: Always
          env:
            - name: TOTAL_SHARDS
              value: "3"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"