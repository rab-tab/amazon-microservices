# ════════════════════════════════════════════════════════════════
# Sharded test runner — K8s Indexed Job (with S3 result aggregation)
#
# BUILD_ID is substituted by Jenkins at apply time (sed), so each
# pipeline run's shard results land under a distinct S3 prefix.
#
# AWS credentials come from a K8s Secret ("aws-s3-creds") that Jenkins
# creates fresh before every run — same refresh-per-run pattern as
# ecr-registry-secret, since these are just jenkins-aws-user's own
# long-lived keys, not a short-lived token, but keeping the same
# create-fresh-each-run habit avoids ever depending on a stale secret.
# ════════════════════════════════════════════════════════════════
apiVersion: batch/v1
kind: Job
metadata:
  name: sharded-test-run
  namespace: amazon
spec:
  completionMode: Indexed
  completions: 3
  parallelism: 3
  backoffLimit: 0
  # ttlSecondsAfterFinished intentionally omitted — Jenkins' own
  # aggregation step needs the pods to still exist right after
  # completion; cleanup happens explicitly in the Jenkinsfile instead.
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: test-shard
          image: 978185568053.dkr.ecr.us-east-1.amazonaws.com/amazon-test-automation:latest
          imagePullPolicy: Always
          env:
            - name: TOTAL_SHARDS
              value: "3"
            - name: BUILD_ID
              value: "__BUILD_ID__"   # substituted by Jenkins before apply
            - name: S3_BUCKET
              value: "amazon-microservices-build-artifacts-978185568053"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-s3-creds
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-s3-creds
                  key: secret-access-key
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"