# ════════════════════════════════════════════════════════════════
# Local Test Environment Docker Compose
# File: amazon-microservices/docker/ci/docker-compose.local.yml
#
# Used BY the automation pipeline — not started manually.
# ...
# ════════════════════════════════════════════════════════════════

version: '3.8'

x-test-label: &test-label
  labels:
    project: "amazon-local"
    managed-by: "jenkins-automation-pipeline"

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:

  # ── Infrastructure ─────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: test-postgres
    <<: *test-label
    logging: *default-logging
    environment:
      POSTGRES_USER: amazon
      POSTGRES_PASSWORD: amazon123
      POSTGRES_DB: users_db
    ports:
      - "5432:5432"
    networks:
      - test-net
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amazon -d users_db"]
      interval: 5s
      timeout: 3s
      retries: 15

  db-init:
    image: postgres:15-alpine
    container_name: test-db-init
    <<: *test-label
    logging: *default-logging
    environment:
      PGPASSWORD: amazon123
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        psql -h postgres -U amazon -d users_db -c 'CREATE DATABASE products_db' 2>/dev/null || true &&
        psql -h postgres -U amazon -d users_db -c 'CREATE DATABASE orders_db' 2>/dev/null || true &&
        psql -h postgres -U amazon -d users_db -c 'CREATE DATABASE payments_db' 2>/dev/null || true &&
        echo 'All databases initialised'
      "
    networks:
      - test-net

  redis:
    image: redis:7-alpine
    container_name: test-redis
    <<: *test-label
    logging: *default-logging
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis123 --maxmemory 64mb --maxmemory-policy allkeys-lru
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: test-zookeeper
    <<: *test-label
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo ruok | timeout 5 bash -c 'exec 3<>/dev/tcp/localhost/2181; cat >&3; cat <&3' | grep imok"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: ruok,mntr,stat
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=*"
    networks:
      - test-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: test-kafka
    <<: *test-label
    logging: *default-logging
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_HEAP_OPTS: "-Xmx192m -Xms96m"
      KAFKA_LOG_RETENTION_MS: 300000
    networks:
      - test-net
    healthcheck:
      test: [
        "CMD-SHELL",
        "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"
      ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  zipkin:
    image: openzipkin/zipkin-slim:latest
    container_name: test-zipkin
    <<: *test-label
    logging: *default-logging
    ports:
      - "9411:9411"
    networks:
      - test-net

  # ── Sharded order-service test infra (Partition Routing tests) ──
  # NOT part of the default pipeline run — only started when explicitly
  # targeting the sharding test suite, e.g.:
  #   docker-compose -f docker-compose.local.yml up -d toxiproxy \
  #     order-db-shard0 order-db-shard1 order-db-shard2 order-db-shard3 \
  #     order-service-sharded

  order-db-shard0:
    image: postgres:16-alpine
    container_name: test-order-db-shard0
    <<: *test-label
    logging: *default-logging
    environment:
      POSTGRES_USER: amazon
      POSTGRES_PASSWORD: amazon123
      POSTGRES_DB: orders
    networks:
      - test-net
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amazon -d orders"]
      interval: 5s
      timeout: 3s
      retries: 15

  order-db-shard1:
    image: postgres:16-alpine
    container_name: test-order-db-shard1
    <<: *test-label
    logging: *default-logging
    environment:
      POSTGRES_USER: amazon
      POSTGRES_PASSWORD: amazon123
      POSTGRES_DB: orders
    networks:
      - test-net
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amazon -d orders"]
      interval: 5s
      timeout: 3s
      retries: 15

  order-db-shard2:
    image: postgres:16-alpine
    container_name: test-order-db-shard2
    <<: *test-label
    logging: *default-logging
    environment:
      POSTGRES_USER: amazon
      POSTGRES_PASSWORD: amazon123
      POSTGRES_DB: orders
    networks:
      - test-net
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amazon -d orders"]
      interval: 5s
      timeout: 3s
      retries: 15

  order-db-shard3:
    image: postgres:16-alpine
    container_name: test-order-db-shard3
    <<: *test-label
    logging: *default-logging
    environment:
      POSTGRES_USER: amazon
      POSTGRES_PASSWORD: amazon123
      POSTGRES_DB: orders
    networks:
      - test-net
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amazon -d orders"]
      interval: 5s
      timeout: 3s
      retries: 15

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: test-toxiproxy
    <<: *test-label
    logging: *default-logging
    ports:
      - "8474:8474"
      - "15432-15435:15432-15435"
    networks:
      - test-net
    depends_on:
      order-db-shard0:
        condition: service_healthy
      order-db-shard1:
        condition: service_healthy
      order-db-shard2:
        condition: service_healthy
      order-db-shard3:
        condition: service_healthy

  # ── Microservices ──────────────────────────────────────────────

  user-service:
    image: 978185568053.dkr.ecr.us-east-1.amazonaws.com/amazon-user-service:${TAG_USER_SERVICE:-latest}
    container_name: test-user-service
    <<: *test-label
    logging: *default-logging
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local-test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/users_db
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_MAIN_LAZY_INITIALIZATION: "true"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      SPRING_DATASOURCE_USERNAME: amazon
      SPRING_DATASOURCE_PASSWORD: amazon123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: redis123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_SECURITY_JWT_SECRET: local-test-jwt-secret-minimum-256-bits-required-here
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Djava.security.egd=file:/dev/./urandom"
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
    networks:
      - test-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 600s

  product-service:
    image: 978185568053.dkr.ecr.us-east-1.amazonaws.com/amazon-product-service:${TAG_PRODUCT_SERVICE:-latest}
    container_name: test-product-service
    <<: *test-label
    logging: *default-logging
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: local-test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/products_db
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_MAIN_LAZY_INITIALIZATION: "true"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      SPRING_DATASOURCE_USERNAME: amazon
      SPRING_DATASOURCE_PASSWORD: amazon123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: redis123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Djava.security.egd=file:/dev/./urandom"
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
    networks:
      - test-net
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 600s

  order-service:
    image: 978185568053.dkr.ecr.us-east-1.amazonaws.com/amazon-order-service:${TAG_ORDER_SERVICE:-latest}
    container_name: test-order-service
    <<: *test-label
    logging: *default-logging
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: local-test,cb-test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders_db
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_MAIN_LAZY_INITIALIZATION: "true"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      SPRING_DATASOURCE_USERNAME: amazon
      SPRING_DATASOURCE_PASSWORD: amazon123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: redis123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Djava.security.egd=file:/dev/./urandom"
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
    networks:
      - test-net
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 600s

  # NOT started by default — separate container so the standard
  # order-service (single-DB) pipeline run is completely unaffected.
  # UNVERIFIED: mixing "sharded" into SPRING_PROFILES_ACTIVE alongside
  # local-test,cb-test has not been confirmed against how order-service's
  # base application.yml sets SPRING_DATASOURCE_URL — if the base profile's
  # single-datasource config and the sharded profile's ShardingSphere
  # datasource config both try to configure a DataSource bean, this may
  # need SPRING_DATASOURCE_URL explicitly unset/excluded for this
  # container. Confirm on first real run before trusting this config.
  order-service-sharded:
    image: 978185568053.dkr.ecr.us-east-1.amazonaws.com/amazon-order-service:${TAG_ORDER_SERVICE:-latest}
    container_name: test-order-service-sharded
    <<: *test-label
    logging: *default-logging
    ports:
      - "8093:8083"
    environment:
      SPRING_PROFILES_ACTIVE: local-test,cb-test,sharded
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_MAIN_LAZY_INITIALIZATION: "true"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: redis123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Djava.security.egd=file:/dev/./urandom"
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
      SHARD0_USER: amazon
      SHARD0_PASS: amazon123
      SHARD1_USER: amazon
      SHARD1_PASS: amazon123
      SHARD2_USER: amazon
      SHARD2_PASS: amazon123
      SHARD3_USER: amazon
      SHARD3_PASS: amazon123
    networks:
      - test-net
    depends_on:
      toxiproxy:
        condition: service_started
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 600s

  payment-service:
    image: 978185568053.dkr.ecr.us-east-1.amazonaws.com/amazon-payment-service:${TAG_PAYMENT_SERVICE:-latest}
    container_name: test-payment-service
    <<: *test-label
    logging: *default-logging
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: local-test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payments_db
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      SPRING_DATASOURCE_USERNAME: amazon
      SPRING_DATASOURCE_PASSWORD: amazon123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: redis123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Djava.security.egd=file:/dev/./urandom"
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
    networks:
      - test-net
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  notification-service:
    image: 978185568053.dkr.ecr.us-east-1.amazonaws.com/amazon-notification-service:${TAG_NOTIFICATION_SERVICE:-latest}
    container_name: test-notification-service
    <<: *test-label
    logging: *default-logging
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: local-test
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx128m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Djava.security.egd=file:/dev/./urandom"
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
    networks:
      - test-net
    depends_on:
      kafka:
        condition: service_healthy

  api-gateway:
    image: 978185568053.dkr.ecr.us-east-1.amazonaws.com/amazon-api-gateway:${TAG_API_GATEWAY:-latest}
    container_name: test-api-gateway
    <<: *test-label
    logging: *default-logging
    ports:
      - "8090:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: redis123
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      SPRING_SECURITY_JWT_SECRET: local-test-jwt-secret-minimum-256-bits-required-here
      SPRING_MAIN_LAZY_INITIALIZATION: "false"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Djava.security.egd=file:/dev/./urandom"
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
    networks:
      - test-net
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health 2>/dev/null | grep -q \"status\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

networks:
  test-net:
    name: amazon-test-network
    driver: bridge